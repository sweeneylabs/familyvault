[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "familyvault"
version = "0.1.4"
description = "Private AI-powered photo and video library"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Patrick Sweeney" }
]

dependencies = [
    "fastapi",
    "uvicorn",
    "pillow",
    "sqlalchemy"
]

[project.scripts]
familyvault = "familyvault.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
